<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Histórico de atividades do Portal RBS">
    <title>RBS Patrocinadores | Auditoria</title>
    <link rel="stylesheet" href="../assets/css/style_portal.css">
    <script src="../src/guards/security.js"></script>
</head>

<body class="history-page">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-area">
            <header class="topbar"></header>

            <main class="content">
                <header class="history-header history-header-row">
                    <div>
                        <h1>Histórico</h1>
                        <p>Consulte as atividades realizadas no portal.</p>
                    </div>
                    <button class="button button-primary" type="button" id="btnImportarLogsPdf">
                        Importar Relatório de Logs
                    </button>
                </header>

                <form class="history-filters" id="historyFilters">
                    <label for="filterEmail">
                        E-mail
                        <input id="filterEmail" type="search" placeholder="Filtrar por e-mail">
                    </label>
                    <label for="filterDate">
                        Data
                        <input id="filterDate" type="date">
                    </label>
                    <label for="filterAction">
                        Tipo de ação
                        <select id="filterAction">
                            <option value="">Todas as ações</option>
                        </select>
                    </label>
                    <button class="history-filter-reset" type="reset">Limpar filtros</button>
                </form>

                <div class="history-table-wrapper">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th scope="col">E-mail</th>
                                <th scope="col">Data</th>
                                <th scope="col">Hora</th>
                                <th scope="col">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="historyRows">
                            <tr>
                                <td colspan="4">Carregando histórico de auditoria...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="paginacaoHistoricoContainer" style="display: flex; justify-content: center; margin-top: 16px;"
                    hidden>
                    <button type="button" class="button button-primary" id="btnExpandirMaisLogs">
                        Mostrar mais registros (+20)
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="../src/services/api.js"></script>
    <script src="../src/pages/historico.js"></script>
    <script src="../src/shared/layout.js"></script>
</body>

</html>
